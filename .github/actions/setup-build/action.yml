name: Set up build tools
description: Install the pinned toolchains and Android packages without signing credentials.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
      with:
        env: true
    # Hosted runner images need not contain an SDK or sdkmanager on PATH.
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        log-accepted-android-sdk-licenses: false
    - name: Android SDK
      shell: bash
      run: |
        sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/') }}
