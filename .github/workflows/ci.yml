name: CI
on:
  # Application changes only. Documentation and license edits cannot break a
  # build, so they should not occupy a 20 minute emulator run. Workflow files
  # stay outside this filter so a pipeline change is always verified.
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'licenses/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'licenses/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Group a pull request with its head branch so a new push cancels the run it
  # supersedes instead of queueing another 20 minute emulator job.
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
